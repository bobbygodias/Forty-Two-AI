name: Forty-Two AI Android CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches:
      - main

concurrency:
  group: forty-two-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: yarn

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Vulkan build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends glslc libvulkan-dev spirv-headers

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Lint changed application code
        run: yarn eslint src/components/EnterpriseQuickPanel src/components/ChatHeader src/components/ChatHeaderTitle src/store/EnterpriseRuntimeStore.ts src/specs/NativeHardwareInfo.ts || true

      - name: Prepare llama.rn Vulkan backend
        run: bash scripts/prepare-llama-vulkan.sh

      - name: Probe Vulkan registry device count for diagnostic v4
        run: bash scripts/probe-vulkan-device-count-for-diagnostic-v4.sh

      - name: Prune llama.rn to MEGA 3 native targets
        shell: python
        run: |
          from pathlib import Path

          inner = Path('node_modules/llama.rn/android/src/main/rnllama/CMakeLists.txt')
          text = inner.read_text()
          old = '''if (ANDROID_ABI AND ANDROID_ABI STREQUAL "arm64-v8a")
              # ARM64 targets
              build_rnllama_library("rnllama_v8" "arm" "-march=armv8-a")
              build_rnllama_library("rnllama_v8_2" "arm" "-march=armv8.2-a")
              build_rnllama_library("rnllama_v8_2_dotprod" "arm" "-march=armv8.2-a+dotprod")
              build_rnllama_library("rnllama_v8_2_i8mm" "arm" "-march=armv8.2-a+i8mm")
              build_rnllama_library("rnllama_v8_2_dotprod_i8mm" "arm" "-march=armv8.2-a+dotprod+i8mm")
              build_rnllama_library("rnllama_v8_2_dotprod_i8mm_hexagon_opencl" "arm" "-march=armv8.2-a+dotprod+i8mm")
          '''
          new = '''if (ANDROID_ABI AND ANDROID_ABI STREQUAL "arm64-v8a")
              # Forty-Two AI device build: MEGA 3 reports DotProd=yes,
              # I8MM=no. Build only the runtime-selected optimized target; the
              # generic rnllama target above stays present for loader fallback.
              build_rnllama_library("rnllama_v8_2_dotprod" "arm" "-march=armv8.2-a+dotprod")
          '''
          if old not in text:
              raise SystemExit('Could not locate inner llama.rn ARM64 target block')
          inner.write_text(text.replace(old, new, 1))

          outer = Path('node_modules/llama.rn/android/src/main/CMakeLists.txt')
          text = outer.read_text()
          old = '''    build_rnllama_jni("rnllama_jni_v8" "rnllama_v8" "arm" "-march=armv8-a")
              build_rnllama_jni("rnllama_jni_v8_2" "rnllama_v8_2" "arm" "-march=armv8.2-a")
              build_rnllama_jni("rnllama_jni_v8_2_dotprod" "rnllama_v8_2_dotprod" "arm" "-march=armv8.2-a+dotprod")
              build_rnllama_jni("rnllama_jni_v8_2_i8mm" "rnllama_v8_2_i8mm" "arm" "-march=armv8.2-a+i8mm")
              build_rnllama_jni("rnllama_jni_v8_2_dotprod_i8mm" "rnllama_v8_2_dotprod_i8mm" "arm" "-march=armv8.2-a+dotprod+i8mm")
              build_rnllama_jni("rnllama_jni_v8_2_dotprod_i8mm_hexagon_opencl" "rnllama_v8_2_dotprod_i8mm_hexagon_opencl" "arm" "-march=armv8.2-a+dotprod+i8mm")
          '''
          new = '''    # Forty-Two AI MEGA 3 device build. RNLlama.java
              # selects this target first when DotProd is present; generic JNI
              # above remains available as a non-destructive fallback.
              build_rnllama_jni("rnllama_jni_v8_2_dotprod" "rnllama_v8_2_dotprod" "arm" "-march=armv8.2-a+dotprod")
          '''
          if old not in text:
              raise SystemExit('Could not locate outer llama.rn ARM64 JNI target block')
          outer.write_text(text.replace(old, new, 1))

      - name: Create local CI Firebase placeholder
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "forty-two-ai-local",
              "storage_bucket": "forty-two-ai-local.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.pocketpalai"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "LOCAL_ONLY_PLACEHOLDER"}],
                "services": {"appinvite_service": {"other_platform_oauth_client": []}}
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Build prodDebug ARM64 APK with Vulkan device-count probe
        working-directory: android
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
          GRADLE_OPTS: '-Dorg.gradle.workers.max=2'
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleProdDebug \
            -PrnllamaBuildFromSource=true \
            -PreactNativeArchitectures=arm64-v8a \
            --max-workers=2 \
            --console=plain \
            --stacktrace 2>&1 | tee ../enterprise-build.log

      - name: Preserve native build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forty-two-ai-native-build-log-v4
          path: enterprise-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Collect APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forty-two-ai-mega3-vulkan-test-04-device-count-probe
          path: android/app/build/outputs/apk/prod/debug/*.apk
          if-no-files-found: error
          retention-days: 7
