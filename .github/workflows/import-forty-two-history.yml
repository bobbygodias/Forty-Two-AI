name: Import Forty-Two AI history

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import current Forty-Two AI development history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "Forty-Two AI Migration"
          git config user.email "actions@users.noreply.github.com"

          # Fetch the complete ancestry of our active development branch.
          git fetch --no-tags https://github.com/bobbygodias/pocketpal-enterprise.git \
            enterprise/mega3-vulkan-ui:refs/heads/source-history

          # GitHub Actions' GITHUB_TOKEN may write repository contents but is
          # intentionally blocked from importing historical workflow changes.
          # Rewrite ONLY the imported source branch to remove .github/workflows
          # from its historical commits. Current workflow files are restored
          # afterwards through the GitHub connector with its proper permission.
          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch --force \
            --index-filter 'git rm -r --cached --ignore-unmatch .github/workflows' \
            --prune-empty \
            -- source-history

          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            source-history:refs/heads/migration/full-history

          echo "Imported filtered source commit: $(git rev-parse source-history)"
          echo "Current workflows will be restored separately, unchanged."
